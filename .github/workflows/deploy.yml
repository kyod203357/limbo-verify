name: deploy
# Releases deploy from a version tag (v1.2.3). Run workflow manually for a preview deploy of any branch.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repo settings to gate production deploys.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$want" || { echo "tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; }
      - name: Vendor the verifier
        run: npm run vendor${{ startsWith(github.ref, 'refs/tags/') && ' -- --release' || '' }}
      - run: npm test
      - name: Build
        run: npm run ${{ startsWith(github.ref, 'refs/tags/') && 'build:release' || 'build' }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=limbo-verify --branch=${{ startsWith(github.ref, 'refs/tags/') && 'main' || 'preview' }}
